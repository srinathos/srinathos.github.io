---
layout: default
---

<div class="posts">
  {% assign blog_posts = site.posts | where_exp: "post", "post.layout != 'gallery'" %}
  {% for post in blog_posts %}
    <article class="post">

      <h1><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h1>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
