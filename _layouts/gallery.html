---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="gallery-container">
    {% for image in page.images %}
    <figure class="gallery-item" itemscope itemtype="http://schema.org/ImageObject">
      <a href="{{ image.full }}" itemprop="contentUrl" data-size="{{ image.width }}x{{ image.height }}" data-caption="{{ image.caption }}">
        <img src="{{ image.thumbnail }}" itemprop="thumbnail" alt="{{ image.alt | default: image.caption }}" />
      </a>
      <figcaption itemprop="caption description">{{ image.caption }}</figcaption>
    </figure>
    {% endfor %}
  </div>

  {% include gallery/photoswipe.html %}
</article>
